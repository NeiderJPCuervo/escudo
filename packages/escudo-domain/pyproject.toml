[project]
name = "escudo-domain"
version = "0.1.0"
description = "Dominio de Escudo: ventanas, features, reglas, modelo portable, umbral por costo y grafo de mulas"
requires-python = ">=3.12"
dependencies = []  # solo biblioteca estándar: el mismo código corre en el servidor y en Pyodide

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escudo_domain"]
