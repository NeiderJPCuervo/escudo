[project]
name = "escudo-sim"
version = "0.1.0"
description = "Simulador con semilla de pagos inmediatos legítimos y fraudulentos, con ground truth y líneas base"
requires-python = ">=3.12"
dependencies = ["escudo-domain"]

[project.scripts]
escudo-baseline = "escudo_sim.evaluate:main"

[tool.uv.sources]
escudo-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escudo_sim"]
